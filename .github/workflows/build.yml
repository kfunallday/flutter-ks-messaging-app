name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true # Enables dependency caching to speed up builds

    - name: Install Dependencies
      run: flutter pub get

    - name: Restore Keystore
      if: env.KEYSTORE_BASE64 != ''
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p ~/.android
        python3 -c "import base64, os; open(os.path.expanduser('~/.android/debug.keystore'), 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ksmessaging-release-apk
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 7 # Automatically cleans up old build files after 7 days